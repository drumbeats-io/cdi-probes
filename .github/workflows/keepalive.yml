# GitHub disables scheduled workflows after 60 days without repo activity.
# Re-enabling them through the API every week resets that timer.
name: keepalive
on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
permissions:
  actions: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/cdi.yml/enable"
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
